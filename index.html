<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-brand-title="Login">Login — Cepa App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
</head>
<body class="min-h-screen font-sans bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 flex items-center justify-center p-4">

  <!-- Background blobs -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-48 -right-48 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-48 -left-48 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-500/5 rounded-full blur-3xl"></div>
  </div>

  <div class="w-full max-w-md relative z-10">

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 shadow-lg shadow-blue-900/50 mb-4">
        <span data-brand-logo class="text-white text-2xl"><i class="fas fa-toolbox"></i></span>
      </div>
      <h1 data-brand-name class="text-3xl font-extrabold text-white tracking-tight">Cepa App</h1>
      <p data-brand-tagline class="text-blue-300/80 text-sm mt-1 font-medium">Sistem Informasi Manajemen Peminjaman Alat</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl shadow-black/40 overflow-hidden">
      <div class="h-1 bg-gradient-to-r from-blue-500 via-indigo-500 to-blue-600"></div>
      <div class="p-8">
        <h2 class="text-xl font-bold text-gray-900 mb-1">Selamat Datang</h2>
        <p class="text-sm text-gray-500 mb-6">Masukkan kredensial akun Anda untuk melanjutkan</p>

        <!-- Error alert -->
        <div id="errorAlert" class="hidden mb-5 flex items-start gap-3 p-3.5 bg-red-50 border border-red-200 rounded-xl text-sm text-red-800">
          <i class="fas fa-exclamation-circle text-red-500 mt-0.5 flex-shrink-0"></i>
          <span id="errorText">Username atau password salah</span>
        </div>

        <form id="loginForm" novalidate>
          <!-- Username -->
          <div class="mb-4">
            <label for="username" class="block text-sm font-semibold text-gray-700 mb-1.5">Username</label>
            <div class="relative">
              <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                <i class="fas fa-user text-sm"></i>
              </span>
              <input id="username" type="text" autocomplete="username"
                class="w-full pl-10 pr-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400"
                placeholder="Masukkan username" required>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-6">
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
            <div class="relative">
              <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                <i class="fas fa-lock text-sm"></i>
              </span>
              <input id="password" type="password" autocomplete="current-password"
                class="w-full pl-10 pr-11 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-gray-400"
                placeholder="Masukkan password" required>
              <button type="button" onclick="togglePass()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-gray-600">
                <i id="eyeIcon" class="fas fa-eye text-sm"></i>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" id="loginBtn"
            class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold rounded-xl shadow-md shadow-blue-200 transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
            <i class="fas fa-sign-in-alt"></i>
            Masuk
          </button>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-slate-500 text-xs mt-6">
      <span data-brand-footer>© 2026 Cepa App · Sistem Informasi Manajemen Peminjaman Alat</span>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    loadBranding();
    // Auto-redirect if already logged in
    (function() {
      const u = localStorage.getItem('cepa_user');
      if (u) {
        const user = JSON.parse(u);
        window.location.href = user.role === 'admin' ? 'admin.html' : 'user.html';
      }
    })();

    function togglePass() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
      else { pwd.type = 'password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
    }

    function fillDemo(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const alert = document.getElementById('errorAlert');

      alert.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Memverifikasi...';

      try {
        const url = `${CONFIG.APPS_SCRIPT_URL}?action=login&u=${encodeURIComponent(username)}&p=${encodeURIComponent(password)}`;
        const res  = await fetch(url, { redirect: 'follow' });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('cepa_user', JSON.stringify(data.user));
          btn.innerHTML = '<i class="fas fa-check"></i> Berhasil!';
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? 'admin.html' : 'user.html';
          }, 400);
        } else {
          document.getElementById('errorText').textContent = data.message || 'Username atau password salah';
          alert.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
        }
      } catch (err) {
        document.getElementById('errorText').textContent = 'Gagal terhubung ke server. Pastikan URL Apps Script sudah benar di config.js.';
        alert.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
      }
    });
  </script>
</body>
</html>
